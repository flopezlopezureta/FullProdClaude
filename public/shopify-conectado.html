<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conexión con Shopify | Full Envíos</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-primary: #6366f1;
            --success: #10b981;
            --bg: #0f172a;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .icon-circle {
            width: 72px;
            height: 72px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
        }
        h1 { margin: 0 0 0.5rem; font-size: 1.6rem; font-weight: 700; }
        p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.25rem; font-size: 0.95rem; }
        .shop-name { color: white; font-weight: 600; }
        .token-box {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.9rem;
            padding: 1rem 1.1rem;
            font-family: monospace;
            font-size: 0.95rem;
            word-break: break-all;
            text-align: left;
            margin-bottom: 1rem;
        }
        .steps {
            text-align: left;
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 0.9rem;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        .steps ol { margin: 0.4rem 0 0; padding-left: 1.2rem; }
        .steps li { margin-bottom: 0.35rem; }
        .btn {
            background: var(--brand-primary);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 0.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 20px -8px rgba(99, 102, 241, 0.5); }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container" id="container">
        <p>Cargando…</p>
    </div>

    <script>
        const container = document.getElementById('container');
        const ref = new URLSearchParams(window.location.search).get('ref');

        function renderError(message) {
            container.innerHTML = `
                <div class="icon-circle" style="background: rgba(248,113,113,0.1); color: #f87171;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </div>
                <h1>No se pudo mostrar el token</h1>
                <p class="error">${message}</p>
                <p>Este enlace es de un solo uso — si ya lo abriste antes, pide que se repita la conexión desde Shopify.</p>
            `;
        }

        function renderToken(shop, token) {
            container.innerHTML = `
                <div class="icon-circle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                </div>
                <h1>Conexión Exitosa</h1>
                <p>Tu tienda <span class="shop-name">${shop}</span> se autorizó correctamente. Copia este token y complétalo en Full Envíos:</p>
                <div class="token-box" id="token-box">${token}</div>
                <div class="steps">
                    Para terminar de vincular tu tienda:
                    <ol>
                        <li>Copia el token de arriba.</li>
                        <li>Entra a tu cuenta de Full Envíos → Configuración → Integraciones.</li>
                        <li>En Shopify, elige "usar configuración manual" y pega la URL de tu tienda y este token.</li>
                    </ol>
                </div>
                <button class="btn" id="copy-btn">Copiar Token</button>
            `;
            document.getElementById('copy-btn').addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(token);
                    const btn = document.getElementById('copy-btn');
                    btn.textContent = '¡Copiado!';
                    setTimeout(() => { btn.textContent = 'Copiar Token'; }, 2000);
                } catch (e) {
                    alert('No se pudo copiar automáticamente. Selecciona el token manualmente.');
                }
            });
        }

        (async () => {
            if (!ref) {
                renderError('Falta el identificador de la conexión.');
                return;
            }
            try {
                const res = await fetch(`/api/integrations/shopify/pending-token/${encodeURIComponent(ref)}`);
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    renderError(data.message || 'El enlace ya no es válido.');
                    return;
                }
                const data = await res.json();
                renderToken(data.shop, data.accessToken);
            } catch (e) {
                renderError('No se pudo contactar al servidor. Intenta de nuevo.');
            }
        })();
    </script>
</body>
</html>
